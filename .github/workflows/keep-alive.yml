name: Keep Alive

on:
  schedule:
    # 毎日 00:00 UTC = 09:00 JST
    # HF Spaces の gcTimeout が 48時間 なので、必ずそれより短い間隔で回すこと。
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

# 同時実行を防ぐ
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # HF Space は訪問しても起きないので、先に API で叩き起こす
      - name: Wake Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node hf-restart.js

      # ログイン後にしかクエリが飛ばないアプリのために、DB へ直接到達させる
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node supabase-ping.js

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 実ブラウザで巡回し、Streamlit を起こしつつ無操作タイマーをリセットする
      - name: Run keep-alive
        run: node keep-alive.js

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore
