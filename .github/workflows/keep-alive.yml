name: Keep Alive

on:
  schedule:
    # ┌──────────────────────────────────────────────┐
    # │ 実行時刻の変更はこの 1 行だけ                 │
    # │ 現在: 毎日 08:00 (JST)                        │
    # └──────────────────────────────────────────────┘
    #
    # cron は UTC 表記。JST = UTC + 9時間 なので「JSTの時刻 - 9」を書く。
    # マイナスになる場合は 24 を足す（前日扱いだが毎日実行なので影響なし）。
    #
    #   JST 06:00 → '0 21 * * *'      JST 15:00 → '0 6 * * *'
    #   JST 07:00 → '0 22 * * *'      JST 18:00 → '0 9 * * *'
    #   JST 08:00 → '0 23 * * *'  ←今ここ
    #   JST 09:00 → '0 0 * * *'       JST 21:00 → '0 12 * * *'
    #   JST 12:00 → '0 3 * * *'       JST 00:00 → '0 15 * * *'
    #
    # 分を変えたい場合は先頭の数字（例: JST 08:30 → '30 23 * * *'）。
    #
    # 注意1: HF Spaces の gcTimeout が 48時間 なので、間隔は必ず 48時間 未満にすること。
    # 注意2: GitHub 側の混雑により、実際の開始は数分〜30分ほど遅れることがある。
    #        時刻厳守の用途には向かない。
    - cron: '0 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]

# 同時実行を防ぐ
concurrency:
  group: keep-alive
  cancel-in-progress: false

# 履歴 (docs/history.json) を書き戻すため
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # HF Space は訪問しても起きないので、先に API で叩き起こす
      - name: Wake Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node hf-restart.js

      # ログイン後にしかクエリが飛ばないアプリのために、DB へ直接到達させる
      - name: Ping Supabase
        env:
          # URL は秘密情報ではないので urls.json 側で管理する
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node supabase-ping.js

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 実ブラウザで巡回し、Streamlit を起こしつつ無操作タイマーをリセットする
      # 失敗しても履歴は残したいので continue-on-error にし、最後に判定する
      - name: Run keep-alive
        id: keepalive
        continue-on-error: true
        run: node keep-alive.js

      # ダッシュボード用の履歴を更新して push する
      - name: Update dashboard history
        if: always()
        run: |
          node report.js
          if [ -n "$(git status --porcelain docs/history.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/history.json
            git commit -m "履歴を更新 [skip ci]"
            # 同時実行や手動 push と競合した場合に備えてリトライする
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
              sleep 5
            done
            echo "履歴の push に失敗しました" >&2
            exit 1
          fi

      - name: Upload screenshots on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore

      # 履歴を残したうえで、巡回が失敗していればジョブを失敗させる
      - name: Fail if keep-alive failed
        if: steps.keepalive.outcome == 'failure'
        run: |
          echo "keep-alive.js が失敗しました。ダッシュボードで対象を確認してください。" >&2
          exit 1
