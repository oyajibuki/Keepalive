name: Keep Alive

on:
  schedule:
    # ┌──────────────────────────────────────────────┐
    # │ 実行間隔の変更はこの 1 行だけ                 │
    # │ 現在: 6時間おき（JST 02:17/08:17/14:17/20:17）│
    # └──────────────────────────────────────────────┘
    #
    # ■ なぜ 6時間おきで、しかも :17 という半端な分なのか
    #
    # GitHub Actions のスケジュールは「ベストエフォート」で、混雑時は
    # 遅延するだけでなく "実行そのものが欠落" する。公式にそう明記されている。
    # 実際 2026-08-03 の 11:00 UTC (JST 20:00) は発火しなかった。
    #
    #   対策1: :00 ちょうどを避ける。全世界のジョブが集中する最悪の時間帯。
    #          :17 のような半端な分にすると欠落しにくい。
    #   対策2: 回数を増やして冗長化する。2回中1回落ちると24時間空くが、
    #          4回中1回なら12時間で済む。1回の欠落が致命傷にならない。
    #
    # 実測: Streamlit は 13.5時間 で寝ていた。12時間間隔では余裕がない。
    #
    # cron は UTC 表記。JST = UTC + 9時間 なので「JSTの時刻 - 9」を書く。
    # マイナスになる場合は 24 を足す。時刻はカンマ区切りで複数指定できる。
    #
    #    6時間おき → '17 5,11,17,23 * * *'    JST 02:17/08:17/14:17/20:17 ←今ここ
    #    4時間おき → '17 3,7,11,15,19,23 * * *'
    #    8時間おき → '17 7,15,23 * * *'       JST 08:17/16:17/00:17
    #   12時間おき → '17 11,23 * * *'         JST 08:17/20:17
    #   1日1回     → '17 23 * * *'            JST 08:17
    #
    # 単発の時刻を変えたい場合の換算:
    #   JST 06:00 → 21    JST 12:00 → 3     JST 20:00 → 11
    #   JST 08:00 → 23    JST 16:00 → 7     JST 00:00 → 15
    #
    # 注意1: HF Spaces の gcTimeout が 48時間 なので、間隔は必ず 48時間 未満にすること。
    # 注意2: 分は :00 や :30 を避けること（欠落しやすくなる）。
    # 注意3: パブリックリポジトリなら Actions の実行時間は無料。間隔を詰めても課金されない。
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]

# 同時実行を防ぐ
concurrency:
  group: keep-alive
  cancel-in-progress: false

# 履歴 (docs/history.json) を書き戻すため
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # HF Space は訪問しても起きないので、先に API で叩き起こす
      - name: Wake Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node hf-restart.js

      # ログイン後にしかクエリが飛ばないアプリのために、DB へ直接到達させる
      - name: Ping Supabase
        env:
          # URL は秘密情報ではないので urls.json 側で管理する
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node supabase-ping.js

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # 実ブラウザで巡回し、Streamlit を起こしつつ無操作タイマーをリセットする
      # 失敗しても履歴は残したいので continue-on-error にし、最後に判定する
      - name: Run keep-alive
        id: keepalive
        continue-on-error: true
        run: node keep-alive.js

      # ダッシュボード用の履歴を更新して push する
      - name: Update dashboard history
        if: always()
        run: |
          node report.js
          if [ -n "$(git status --porcelain docs/history.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/history.json
            git commit -m "履歴を更新 [skip ci]"
            # 同時実行や手動 push と競合した場合に備えてリトライする
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
              sleep 5
            done
            echo "履歴の push に失敗しました" >&2
            exit 1
          fi

      - name: Upload screenshots on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore

      # 履歴を残したうえで、巡回が失敗していればジョブを失敗させる
      - name: Fail if keep-alive failed
        if: steps.keepalive.outcome == 'failure'
        run: |
          echo "keep-alive.js が失敗しました。ダッシュボードで対象を確認してください。" >&2
          exit 1
